name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Workspace/Assets/terminal/package-lock.json

      - name: Build
        shell: pwsh
        run: ./Build-Workspace.ps1

      - name: Publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '0.0.0' }
          $out = "artifacts/GitWorkspace-win-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish Workspace/Workspace.csproj -c Release -r win-x64 --self-contained false -o $out --nologo `
            -p:Version=$version -p:InformationalVersion=$version
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path "$out/*" -DestinationPath "artifacts/GitWorkspace-win-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/GitWorkspace-win-x64.zip
          generate_release_notes: true
